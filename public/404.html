<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Lost in the Void</title>
    <link rel="icon" type="image/gif" href="assets/g/wavingwelcomecat.gif" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/c/fonts.css" />
    <link rel="stylesheet" href="assets/c/style.css" />
  </head>
  <body
    class="bg-[var(--color-secondary)] selection:bg-[var(--color-primary)] overflow-x-hidden font-bricolage text-[var(--color-primary)] selection:text-[var(--color-secondary)] antialiased scroll-smooth"
  >
    <main
      id="page-contents"
      class="flex flex-col justify-between mx-auto px-6 lg:px-12 py-10 max-w-7xl min-h-screen"
    >
      <!-- 404 Section -->
      <section
        id="intro-section"
        aria-label="404 section"
        class="relative flex flex-col gap-8 sm:gap-6 my-auto py-8 min-h-screen justify-center"
      >
        <div
          class="relative flex lg:flex-row flex-col lg:justify-between items-start lg:items-center gap-4 sm:gap-6"
        >
          <h1
            id="headline-top"
            class="max-w-full font-extrabold text-[var(--color-primary)] text-5xl sm:text-7xl lg:text-8xl leading-[0.95] tracking-tighter"
          >
            oops, 404 error,
          </h1>

          <div class="relative flex items-center gap-4 shrink-0">
            <div
              id="meow-container"
              class="relative flex-shrink-0 w-24 sm:w-32 lg:w-44 h-24 sm:h-32 lg:h-44 aspect-square overflow-hidden select-none"
            >
              <img
                id="meow-gif"
                src=""
                alt="404 Cat GIF"
                class="w-full h-full object-cover"
              />
            </div>
          </div>
        </div>

        <div
          class="relative flex lg:flex-row flex-col lg:justify-between lg:items-baseline gap-3 sm:gap-4 my-2"
        >
          <p
            id="subtitle"
            class="min-h-0 lg:min-h-[3rem] font-medium text-[var(--color-muted)] text-base sm:text-lg lg:text-xl tracking-wide"
          >
            <span class="block">
              <span></span>
              <div
                id="spin-cat-container"
                class="relative w-10 sm:w-14 lg:w-18 h-10 sm:h-14 lg:h-18 aspect-square overflow-hidden select-none translate-y-[50%]"
              >
                <img
                  id="spin-cat-gif"
                  src="assets/g/spincat.gif"
                  alt="Spin Cat"
                  class="w-full h-full object-cover"
                />
              </div>
            </span>
          </p>

          <h1
            id="headline-bottom"
            class="lg:ml-auto w-full lg:w-auto font-extrabold text-[var(--color-primary)] text-5xl sm:text-7xl lg:text-8xl lg:text-right leading-[0.95] tracking-tighter"
          >
            lost in the void.
          </h1>
        </div>

        <div class="pt-6">
          <a
            id="home-btn"
            href="/"
            class="manga-button inline-flex items-center gap-2.5 px-6 py-3.5 rounded-xl font-bold text-base bg-[var(--color-secondary)] text-[var(--color-primary)] opacity-0"
          >
            <i class="fa-solid fa-arrow-left text-sm" aria-hidden="true"></i>
            <span>take me home</span>
          </a>
        </div>
      </section>

      <!-- Footer -->
      <footer
        class="mt-20 pt-6 border-t border-[var(--color-muted)]/20 flex items-center justify-between"
      >
        <div class="font-medium text-[var(--color-muted)] text-sm sm:text-base">
          lots of love &lt;3
        </div>
        <div>
          <img
            src="assets/g/catkiss.gif"
            alt="kiss cat"
            class="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-xl"
          />
        </div>
      </footer>
    </main>

    <script src="./bundle/404.js"></script>
  </body>
</html>
